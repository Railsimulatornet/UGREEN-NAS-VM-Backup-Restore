name: Release - Prüfartefakt
on:
  push:
    branches: [release/v4.0.1-validation]
    paths: [.github/workflows/release-source-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Quellstand und Originalpaket laden
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Railsimulatornet/UGREEN-NAS-VM-Backup-Restore.git source
          git -C source checkout --quiet f6245befcf9ac3620ef79bfbdf4416ba7a698426
          mkdir export
          git -C source archive --format=zip --output="$PWD/export/merged-source.zip" HEAD
          gh release download v4.0 --repo Railsimulatornet/UGREEN-NAS-VM-Backup-Restore --pattern UGREEN_VM_Backup_Restore_V4.0.zip --dir export
          echo 'dfea9655c03e23e655231991527836db6254a36d74e90ca94eccaec37b084eee  export/UGREEN_VM_Backup_Restore_V4.0.zip' | sha256sum -c -
      - name: Prüfartefakt bereitstellen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-v4.0.1-inspection
          path: export/*.zip
          retention-days: 3
          if-no-files-found: error
